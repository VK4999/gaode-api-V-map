<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 30px;
            backdrop-filter: blur(10px);
            max-width: 500px;
        }
        h2 {
            color: #ffeb3b;
            font-size: 28px;
            margin: 0 0 20px 0;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h2>⚠️ 找不到地图文件</h2>
        <p>请确保 map.html 文件存在于 static/ 目录下</p>
    </div>
</body>
</html>
